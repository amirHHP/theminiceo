<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default `fa` }}" dir="{{ .Site.Language.LanguageDirection | default `rtl` }}">
  {{- partial "head.html" . -}}
  <body dir="{{ .Site.Language.LanguageDirection | default `rtl` }}">
    {{- partial "navbar.html" . -}}
    {{- block "main" . }}{{ end -}}
    {{- if or (eq .Site.Params.footer.enable nil) (.Site.Params.footer.enable) }}
      {{- partial "footer.html" . -}}
    {{- end -}}
    {{- partial "scripts.html" . -}}
  </body>
</html>
