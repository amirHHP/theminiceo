name: Deploy Hugo site to S3

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.148.0  # <--- Change this from 0.128.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build with Hugo
        run: |
          hugo mod get -u
          hugo --minify
      
      # Verify Secrets (Fail fast if missing)
      - name: Verify Deployment Credentials
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "AWS_ACCESS_KEY_ID is EMPTY"
            exit 1
          fi

      # Deploy to S3 with optimized cache headers
      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'us-east-1'
        run: |
          # 1. Sync immutable static assets with 1-year cache
          aws s3 sync ./public s3://theminiceo \
            --exclude "*" \
            --include "*.css" \
            --include "*.js" \
            --include "*.woff2" \
            --include "*.woff" \
            --include "*.ttf" \
            --include "*.webp" \
            --include "*.png" \
            --include "*.jpg" \
            --include "*.jpeg" \
            --include "*.svg" \
            --include "*.ico" \
            --cache-control "public, max-age=31536000, immutable"

          # 2. Sync HTML, XML, JSON, and remaining files with must-revalidate
          aws s3 sync ./public s3://theminiceo \
            --exclude "*.css" \
            --exclude "*.js" \
            --exclude "*.woff2" \
            --exclude "*.woff" \
            --exclude "*.ttf" \
            --exclude "*.webp" \
            --exclude "*.png" \
            --exclude "*.jpg" \
            --exclude "*.jpeg" \
            --exclude "*.svg" \
            --exclude "*.ico" \
            --cache-control "public, max-age=0, must-revalidate" \
            --delete
