[params]
  description = "مدیرعامل کوچک؛ مرجع تخصصی مدیریت محصول، فریم‌ورک‌های توسعه، کتاب‌ها، دوره‌های آموزشی و مشاوره اختصاصی رشد کسب‌وکار و استارتاپ"
  images = ["images/og-default.png"]

  [params.navbar]
    displayTitle = true
    displayLogo = true
    width = "normal"
    [params.navbar.logo]
      path = "images/logo.svg"
      dark = "images/logo-dark.svg"
      width = 30
      height = 30

  [params.page]
    width = "normal"

  [params.theme]
    default = "system"
    displayToggle = true

  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = false
    width = "normal"

  [params.search]
    enable = true
    type = "flexsearch"
    [params.search.flexsearch]
      index = "content"
      tokenize = "forward"

  [params.zarinpal]
    merchant_id = "" # مرچنت آیدی ۳۶ کاراکتری زرین‌پال (اختیاری جهت وب‌سرویس / اتصال مستقیم)
    default_link = "https://zarinp.al/392035" # لینک پرداخت زرین‌پال پیش‌فرض دوره‌ها

[imaging]
  quality = 70
  resampleFilter = "CatmullRom"

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"