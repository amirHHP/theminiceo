baseURL = 'https://theminiceo.ir'
defaultContentLanguage = 'fa'
title = 'مدیرعامل کوچک | TheMiniCEO'
theme = 'hextra'

enableRobotsTXT = true
hasCJKLanguage = true
relativeURLs = false

[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepComments = true

[taxonomies]
  category = "categories"
  tag = "tags"

defaultContentLanguageInSubdir = false

[languages]
  [languages.fa]
    languageName = 'فارسی'
    label = 'فارسی'
    languageCode = 'fa'
    locale = 'fa-IR'
    languageDirection = 'rtl'
    direction = 'rtl'
    weight = 1
    title = 'مدیرعامل کوچک | TheMiniCEO'
    [languages.fa.params]
      description = 'مدیرعامل کوچک؛ مرجع تخصصی مدیریت محصول، فریم‌ورک‌های توسعه، کتاب‌ها، دوره‌های آموزشی و مشاوره اختصاصی رشد کسب‌وکار و استارتاپ'

  [languages.en]
    languageName = 'English'
    label = 'English'
    languageCode = 'en'
    locale = 'en'
    languageDirection = 'ltr'
    direction = 'ltr'
    weight = 2
    title = 'TheMiniCEO'
    [languages.en.params]
      description = 'TheMiniCEO: product management guides, frameworks, books, courses, and advisory for building products people actually need.'

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[languages.fa.menu.main]]
  identifier = 'docs'
  name = 'مقالات و مستندات'
  pageRef = '/docs/'
  weight = 1
[[languages.fa.menu.main]]
  identifier = 'courses'
  name = 'دوره‌های آموزشی'
  pageRef = '/course/'
  weight = 2
[[languages.fa.menu.main]]
  identifier = 'library'
  name = 'کتابخانه'
  pageRef = '/docs/books/'
  weight = 3
[[languages.fa.menu.main]]
  identifier = 'frameworks'
  name = 'فریم‌ورک‌ها'
  pageRef = '/frameworks/'
  weight = 4
[[languages.fa.menu.main]]
  identifier = 'consulting'
  name = 'مشاوره محصول'
  pageRef = '/product-consultant/'
  weight = 5
[[languages.fa.menu.main]]
  identifier = 'about'
  name = 'درباره ما'
  pageRef = '/about/'
  weight = 6
[[languages.fa.menu.main]]
  identifier = 'products'
  name = 'ابزارها'
  weight = 7
  [languages.fa.menu.main.params]
    type = 'products'
# Add more header tools with parent = 'products' (name, url, description, badge).
[[languages.fa.menu.main]]
  identifier = 'zendo'
  parent = 'products'
  name = 'Zendo'
  url = 'https://zendo.theminiceo.ir/'
  weight = 1
  [languages.fa.menu.main.params]
